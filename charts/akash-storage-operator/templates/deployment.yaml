---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-storage
  namespace: akash-services
  labels:
    akash.network: "true"
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
      app.kubernetes.io/instance: storage-service
      app.kubernetes.io/component: operator
      app.kubernetes.io/part-of: provider
  # all state re-derivable from Volume CRDs + PVs + chain queries; a single
  # replica owns the PV choreography
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
        app.kubernetes.io/instance: storage-service
        app.kubernetes.io/component: operator
        app.kubernetes.io/part-of: provider
    spec:
      serviceAccountName: operator-storage
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator-storage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args:
            - "provider-services"
            - "operator"
            - "storage"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AP_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: operator-storage
                  key: provider-address
            - name: AP_NODE
              valueFrom:
                configMapKeyRef:
                  name: operator-storage
                  key: node
            - name: AP_K8S_MANIFEST_NS
              valueFrom:
                configMapKeyRef:
                  name: operator-storage
                  key: k8s-manifest-ns
            - name: AP_VOLUMES_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: operator-storage
                  key: volumes-namespace
            - name: AP_RESYNC_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: operator-storage
                  key: resync-interval
            - name: AP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AP_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - containerPort: 8080
              name: rest
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
