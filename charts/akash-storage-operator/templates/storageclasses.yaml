{{- range .Values.storageClasses.classes }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}-retain
  # DO NOT REMOVE resource-policy annotation! Every PV backing a volume
  # group is created against a -retain class; losing the class strands
  # re-provisioning while retained data is still adoptable.
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    akash.network: "true"
    akash.network/component: volume
provisioner: {{ $.Values.storageClasses.provisioner }}
parameters:
  pool: {{ .pool }}

  # The value of "clusterID" MUST be the same as the one in which your rook cluster exist
  clusterID: {{ $.Values.storageClasses.clusterID }}

  # RBD image format. Defaults to "2".
  imageFormat: "2"

  # RBD image features. Available for imageFormat: "2". CSI RBD currently supports only `layering` feature.
  imageFeatures: layering

  # Specify the filesystem type of the volume. If not specified, it will use `ext4`.
  csi.storage.k8s.io/fstype: ext4

  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph # namespace:cluster
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph # namespace:cluster
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph # namespace:cluster
# the destruction-proofing invariant: namespace teardown, lease-close
# reflexes, daemon downgrades and operator bugs can at worst Release the PV;
# the RBD image survives. GC flips the policy only on verified destruction.
reclaimPolicy: Retain
allowVolumeExpansion: true
{{- end }}
