---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akash-operator-storage
  labels:
    akash.network: "true"
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
rules:
  # the PV choreography: holder/attach PVC creation and claimRef rewrites
  - apiGroups:
      - ''
    resources:
      - persistentvolumes
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - namespaces
      - events
    verbs:
      - get
      - list
      - watch
  # rook-ceph-tools exec for the replication drivers (rbd export/diff)
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - create
      - get
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
  # snapshot plumbing for stream-export replication
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
      - volumesnapshotcontents
      - volumesnapshotclasses
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - akash.network
    resources:
      - volumes
    verbs:
      - create
      - delete
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - akash.network
    resources:
      - manifests
    verbs:
      - get
      - list
      - watch
