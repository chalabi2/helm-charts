---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akash-operator-storage
  labels:
    akash.network: "true"
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
rules:
  # the PV choreography: identity labels, claimRef rewrites, the reclaim
  # policy flip and the PV's removal at GC
  - apiGroups:
      - ''
    resources:
      - persistentvolumes
    verbs:
      - get
      - update
      - delete
  # holder and attach claims: created, grown by a resize, removed
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - create
      - patch
      - delete
  # --provision-node-hint: the ready node carrying the volume's class
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - list
  # the operator's own pod, for its REST port
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - akash.network
    resources:
      - volumes
    verbs:
      - get
      - list
      - watch
      - update
      - delete
