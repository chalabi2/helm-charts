---
apiVersion: v1
kind: Service
metadata:
  labels:
    akash.network: "true"
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
  # the provider daemon discovers the operator by this service name and the
  # "rest" port name in akash-services
  name: operator-storage
  namespace: akash-services
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 8080
      targetPort: rest
      appProtocol: http
  selector:
    app.kubernetes.io/name: storage
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
